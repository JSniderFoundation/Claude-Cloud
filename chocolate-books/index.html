<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Books</title>
<style>
:root{
  --bg:#faf7f4;--panel:#ffffff;--ink:#2a1f1a;--muted:#7a6a60;--line:#e6ddd5;
  --accent:#6b3e26;--accent-ink:#ffffff;--accent-soft:#f3e8df;
  --good:#2e7d4f;--bad:#b3261e;--warn:#7a5200;--warn-bg:#fff4d6;--row:#fbf8f6;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1b1512;--panel:#251d19;--ink:#f2ebe6;--muted:#b3a399;--line:#3d3029;
    --accent:#d9a273;--accent-ink:#1b1512;--accent-soft:#3a2a20;
    --good:#6fcf97;--bad:#ff8a80;--warn:#f2c45a;--warn-bg:#3a3018;--row:#2a211c;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
a{color:var(--accent)}
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:1150px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;color:var(--accent);margin-right:auto}
.brand small{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
nav{max-width:1150px;margin:0 auto;padding:6px 12px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px;color:var(--muted);font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1150px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:18px;margin:22px 0 8px}
h3{font-size:15px;margin:16px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card .lbl{color:var(--muted);font-size:13px}
.card .val{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.tile:hover{border-color:var(--accent)}
.tile b{display:block;margin-bottom:3px}
.tile span{color:var(--muted);font-size:13px}
.btn{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 13px;font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>span{font-size:13px;color:var(--muted)}
.field small{color:var(--muted);font-size:12px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
input.money{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--row)}
tr.sec td{font-weight:650;background:var(--accent-soft);border-bottom:0}
tr.sub td{font-weight:650;border-top:1px solid var(--muted)}
tr.tot td{font-weight:750;border-top:2px solid var(--ink);border-bottom:3px double var(--ink)}
td.ind{padding-left:22px}
.neg{color:var(--bad)}
.ok{color:var(--good);font-weight:600}
.err{color:var(--bad);font-weight:600}
.banner{max-width:1150px;margin:10px auto 0;padding:0 16px}
.banner>div{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:9px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.pill{display:inline-block;font-size:12px;padding:1px 7px;border-radius:20px;background:var(--accent-soft);color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.tabs .btn.on{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(920px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dhead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
dialog .dhead h2{margin:0;margin-right:auto}
dialog .dbody{padding:14px 16px}
dialog .dfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;display:none;gap:12px;align-items:center;z-index:50;max-width:calc(100vw - 32px)}
#toast button{background:none;border:1px solid var(--bg);color:var(--bg);border-radius:5px;padding:2px 8px;cursor:pointer;font:inherit}
.lines td{padding:4px}
.lines select{width:100%;min-width:180px}
.lines input{width:100%}
.lines input.money{min-width:90px}
.help{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.help p:first-child{margin-top:0}.help p:last-child{margin-bottom:0}
.right{margin-left:auto}
.print-only{display:none}
@media (max-width:600px){ .card .val{font-size:19px} td,th{padding:5px 6px} }
@media print{
  header,.banner,.noprint,.btn,nav,#toast{display:none!important}
  body{background:#fff;color:#000;font-size:12px}
  main{padding:0;max-width:none}
  .panel{border:0;padding:0}
  .print-only{display:block}
  tr.sec td{background:#eee}
}
</style>
</head>
<body>
<header>
  <div class="top"><div class="brand" id="brand">Shop Books</div><span class="muted small noprint" id="saved"></span></div>
  <nav id="nav"></nav>
</header>
<div class="banner" id="banner"></div>
<main id="view"></main>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* =========================================================================
   Shop Books: a free, offline double-entry bookkeeping system.
   All amounts are stored as integer cents. Data lives in this browser's
   localStorage. Use Settings & Backup to download backup files.
   ========================================================================= */

const STORE_KEY = 'shopbooks.v1';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const addYears = (s, n) => `${+s.slice(0, 4) + n}${s.slice(4)}`;
const monthEnd = (y, m) => new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); // m is 1-12
const dow = s => new Date(s + 'T00:00:00Z').getUTCDay();
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = s => s ? `${MONTHS[+s.slice(5, 7) - 1]} ${+s.slice(8, 10)}, ${s.slice(0, 4)}` : '';
const USD = new Intl.NumberFormat('en-US', {style: 'currency', currency: 'USD'});
const fmt = c => (c || 0) < 0 ? `(${USD.format(-c / 100)})` : USD.format((c || 0) / 100);
const fmtB = c => c ? fmt(c) : '';                       // blank when zero
const fmtN = c => `<span class="${c < 0 ? 'neg' : ''}">${fmt(c)}</span>`;
const plain = c => (c / 100).toFixed(2);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

function parseMoney(s) {
  s = String(s ?? '').trim();
  if (!s) return 0;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[$,\s]/g, '');
  if (s.startsWith('-')) { neg = !neg; s = s.slice(1); }
  if (!/^(\d+(\.\d{0,2})?|\.\d{1,2})$/.test(s)) return NaN;
  const [w, f = ''] = s.split('.');
  const c = parseInt(w || '0', 10) * 100 + parseInt((f + '00').slice(0, 2), 10);
  return neg ? -c : c;
}

/* ---------------------------- Chart of accounts ------------------------- */
const TYPES = ['asset', 'liability', 'equity', 'income', 'expense'];
const TYPE_LABEL = {asset: 'Assets', liability: 'Liabilities', equity: 'Equity', income: 'Income', expense: 'Cost of sales & expenses'};
const SUBS = {
  bank: {type: 'asset', label: 'Bank account'},
  cash: {type: 'asset', label: 'Cash on hand'},
  clearing: {type: 'asset', label: 'Card processor clearing'},
  ar: {type: 'asset', label: 'Accounts receivable'},
  inventory: {type: 'asset', label: 'Inventory'},
  otherca: {type: 'asset', label: 'Other current asset'},
  fixed: {type: 'asset', label: 'Fixed asset'},
  ap: {type: 'liability', label: 'Accounts payable'},
  creditcard: {type: 'liability', label: 'Credit card'},
  currentliab: {type: 'liability', label: 'Other current liability'},
  longterm: {type: 'liability', label: 'Long-term liability'},
  equity: {type: 'equity', label: 'Equity'},
  income: {type: 'income', label: 'Sales income'},
  otherincome: {type: 'income', label: 'Other income'},
  cogs: {type: 'expense', label: 'Cost of goods sold'},
  expense: {type: 'expense', label: 'Operating expense'},
  otherexpense: {type: 'expense', label: 'Other expense'},
};
const SEED_ACCOUNTS = [
  ['1000', 'Business Checking', 'bank'],
  ['1010', 'Business Savings', 'bank'],
  ['1050', 'Cash Drawer', 'cash'],
  ['1100', 'Card Processor Clearing', 'clearing', 'Card sales waiting to be paid out by Square/Stripe/Shopify'],
  ['1200', 'Accounts Receivable', 'ar', 'Corporate or wholesale orders invoiced but not yet paid'],
  ['1300', 'Inventory – Chocolate & Ingredients', 'inventory', '', '5000'],
  ['1310', 'Inventory – Packaging', 'inventory', '', '5010'],
  ['1320', 'Inventory – Resale Goods', 'inventory', '', '5020'],
  ['1400', 'Prepaid Expenses', 'otherca'],
  ['1500', 'Equipment & Fixtures', 'fixed'],
  ['1590', 'Accumulated Depreciation', 'fixed', 'Contra-asset: normally a credit balance'],
  ['2000', 'Accounts Payable', 'ap', 'Supplier bills you owe'],
  ['2100', 'Business Credit Card', 'creditcard'],
  ['2200', 'Sales Tax Payable', 'currentliab'],
  ['2300', 'Gift Cards Outstanding', 'currentliab', 'Gift cards sold but not yet redeemed'],
  ['2400', 'Customer Deposits', 'currentliab', 'Deposits on custom/corporate orders not yet delivered'],
  ['2500', 'Loan Payable', 'longterm'],
  ['3000', 'Owner Contributions', 'equity'],
  ['3100', 'Owner Draws', 'equity'],
  ['3200', 'Opening Balance Equity', 'equity', 'Offsets opening balances when you start'],
  ['3900', 'Retained Earnings', 'equity'],
  ['4000', 'Retail Chocolate Sales', 'income'],
  ['4100', 'Gift Boxes & Corporate Orders', 'income'],
  ['4200', 'Classes & Tastings', 'income'],
  ['4300', 'Wholesale Sales', 'income'],
  ['4900', 'Refunds & Discounts', 'income', 'Contra-income: normally a debit balance'],
  ['4950', 'Interest & Other Income', 'otherincome'],
  ['5000', 'COGS – Chocolate & Ingredients', 'cogs'],
  ['5010', 'COGS – Packaging', 'cogs'],
  ['5020', 'COGS – Resale Goods', 'cogs'],
  ['6000', 'Rent', 'expense'],
  ['6010', 'Utilities', 'expense'],
  ['6020', 'Card Processing Fees', 'expense'],
  ['6030', 'Bank Fees', 'expense'],
  ['6040', 'Wages', 'expense'],
  ['6050', 'Payroll Taxes', 'expense'],
  ['6060', 'Insurance', 'expense'],
  ['6070', 'Advertising & Marketing', 'expense'],
  ['6080', 'Software & Website', 'expense'],
  ['6090', 'Repairs & Maintenance', 'expense'],
  ['6100', 'Shop & Kitchen Supplies', 'expense'],
  ['6110', 'Shipping & Delivery', 'expense'],
  ['6120', 'Licenses & Permits', 'expense'],
  ['6130', 'Legal & Accounting', 'expense'],
  ['6140', 'Office Supplies', 'expense'],
  ['6150', 'Depreciation', 'expense'],
  ['6160', 'Travel & Meals', 'expense'],
  ['6900', 'Miscellaneous Expense', 'expense'],
  ['7000', 'Interest Expense', 'otherexpense'],
];
const ROLES = {
  checking:     ['Main bank account',          a => a.sub === 'bank', 'a1000'],
  cashDrawer:   ['Cash drawer',                a => ['cash', 'bank'].includes(a.sub), 'a1050'],
  clearing:     ['Card processor clearing',    a => ['clearing', 'bank'].includes(a.sub), 'a1100'],
  creditCard:   ['Business credit card',       a => a.sub === 'creditcard', 'a2100'],
  ap:           ['Accounts payable',           a => a.sub === 'ap', 'a2000'],
  salesTax:     ['Sales tax payable',          a => tOf(a) === 'liability', 'a2200'],
  giftCards:    ['Gift cards outstanding',     a => tOf(a) === 'liability', 'a2300'],
  sales:        ['Default sales account',      a => tOf(a) === 'income', 'a4000'],
  refunds:      ['Refunds & discounts',        a => tOf(a) === 'income', 'a4900'],
  fees:         ['Card processing fees',       a => tOf(a) === 'expense', 'a6020'],
  ownerContrib: ['Owner contributions',        a => tOf(a) === 'equity', 'a3000'],
  ownerDraw:    ['Owner draws',                a => tOf(a) === 'equity', 'a3100'],
  openingEquity:['Opening balance equity',     a => tOf(a) === 'equity', 'a3200'],
  retained:     ['Retained earnings',          a => tOf(a) === 'equity', 'a3900'],
};

function seed() {
  const roles = {};
  for (const k in ROLES) roles[k] = ROLES[k][2];
  return {
    version: 1,
    settings: {shopName: '', fyStartMonth: 1, lockDate: '', lastBackup: null, lastChange: null, roles, demo: false},
    accounts: SEED_ACCOUNTS.map(([code, name, sub, note, cogs]) => ({id: 'a' + code, code, name, sub, note: note || '', active: true, cogs: cogs ? 'a' + cogs : ''})),
    entries: [], recons: [], items: [], counts: [], nextNo: 1,
  };
}

/* ------------------------------- Storage -------------------------------- */
let db;
function load() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return JSON.parse(raw); } catch (e) { console.error(e); }
  return null;
}
function save(changed = true) {
  if (changed) db.settings.lastChange = Date.now();
  saveLocal();
  if (FS.connected) scheduleFileWrite();
}
function saveLocal() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
  catch (e) { alert('Could not save to browser storage: ' + e.message + '\nDownload a backup now from Settings & Backup.'); }
  showSaved();
}
function showSaved() {
  const n = db.entries.length, cnt = `${n} entr${n === 1 ? 'y' : 'ies'}`;
  let txt = `${cnt} · saved in this browser only`;
  if (FS.connected) txt = `${cnt} · ${FS.state === 'saving' ? 'saving…' : FS.state === 'error' ? '⚠ could not save to' : 'saved to'} ${FS.name}`;
  else if (FS.handle) txt = `${cnt} · ⚠ not connected to ${FS.name}`;
  $('#saved').textContent = txt;
}
function normalizeDb(d) {
  if (!d || !Array.isArray(d.accounts) || !Array.isArray(d.entries) || !d.settings) throw new Error('This is not a Shop Books file.');
  d.recons ||= []; d.items ||= []; d.counts ||= []; d.nextNo ||= Math.max(0, ...d.entries.map(e => e.no || 0)) + 1;
  d.settings.roles = {...seed().settings.roles, ...(d.settings.roles || {})};
  return d;
}

/* ------------------- Books file (e.g. in a OneDrive folder) --------------
   Chrome/Edge only (File System Access API). The linked file is the source
   of truth; localStorage is a cache. Each write bumps a revision number in
   the file. Before writing we re-read the file: if its revision isn't the
   one we last loaded, another computer changed it, so we stop and ask.
   ------------------------------------------------------------------------ */
const FS = {supported: typeof window.showSaveFilePicker === 'function', handle: null, name: '', connected: false,
  knownRev: null, fileId: null, timer: null, busy: false, again: false, state: ''};
const kv = {
  open: () => new Promise((res, rej) => { const r = indexedDB.open('shopbooks', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }),
  async run(mode, fn) { const d = await this.open(); return new Promise((res, rej) => { const q = fn(d.transaction('kv', mode).objectStore('kv')); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  get(k) { return this.run('readonly', s => s.get(k)); },
  set(k, v) { return this.run('readwrite', s => s.put(v, k)); },
  del(k) { return this.run('readwrite', s => s.delete(k)); },
};
const unsynced = () => !!db.settings.lastChange && db.settings.lastChange > (db.syncedAt || 0);
async function readBooksFile() {
  const f = await FS.handle.getFile(), t = await f.text();
  if (!t.trim()) return null;
  let d; try { d = JSON.parse(t); } catch (e) { throw new Error(`${f.name} is not a Shop Books file.`); }
  return normalizeDb(d);
}
function adoptFile(d) {
  db = d; FS.knownRev = d.rev || 0; FS.fileId = d.fileId || FS.fileId || uid();
  db.syncedAt = Date.now(); saveLocal(); render();
}
function setFileState(s) { FS.state = s; showSaved(); }
function scheduleFileWrite() {
  clearTimeout(FS.timer); setFileState('saving');
  FS.timer = setTimeout(() => { FS.timer = null; writeBooksFile(); }, 400);
}
async function writeBooksFile({force = false} = {}) {
  if (!FS.connected) return;
  if (FS.busy) { FS.again = true; return; }
  FS.busy = true;
  try {
    let cur = null;
    try { cur = await readBooksFile(); } catch (e) { if (e.name === 'NotAllowedError' || e.name === 'NotFoundError') throw e; }
    if (!force && cur && (cur.rev || 0) !== FS.knownRev) { setFileState('error'); showConflict(cur); return; }
    const rev = Math.max(cur?.rev || 0, FS.knownRev || 0) + 1;
    db.rev = rev; db.fileId = FS.fileId; db.savedAt = Date.now(); db.syncedAt = db.savedAt;
    const w = await FS.handle.createWritable();
    await w.write(JSON.stringify(db)); await w.close();
    FS.knownRev = rev; saveLocal(); setFileState('saved');
  } catch (e) {
    setFileState('error');
    if (e.name === 'NotAllowedError' || e.name === 'NotFoundError') { FS.connected = false; renderBanner(); showSaved(); }
    toast(e.name === 'NotFoundError' ? `Can't find ${FS.name}. It may have been moved or renamed. Reconnect it in Settings & Backup.` : `Could not save to ${FS.name}: ${e.message}`);
  } finally {
    FS.busy = false;
    if (FS.again) { FS.again = false; writeBooksFile(); }
  }
}
async function connectBooksFile(handle, {ask = false, isNew = false} = {}) {
  if (ask && handle.requestPermission) {
    let p = 'granted';
    try { p = await handle.requestPermission({mode: 'readwrite'}); } catch (e) { /* no user gesture left; the browser will ask on first save */ }
    if (p === 'denied') throw new Error('Permission to edit the file was not given.');
  }
  FS.handle = handle; FS.name = handle.name; FS.connected = true;
  try { await kv.set('fileHandle', handle); } catch (e) { console.warn(e); }
  if (isNew) { FS.fileId = uid(); FS.knownRev = null; db.settings.demo = false; await writeBooksFile({force: true}); render(); return; }
  const d = await readBooksFile();
  if (!d) { FS.fileId = uid(); await writeBooksFile({force: true}); render(); return; }
  if (d.fileId && d.fileId === db.fileId && (d.rev || 0) === (db.rev || 0)) {   // same file, same version
    FS.knownRev = d.rev || 0; FS.fileId = d.fileId;
    if (unsynced()) await writeBooksFile(); else adoptFile(d);
  } else if (unsynced() && db.entries.length) { FS.knownRev = null; FS.fileId = d.fileId || uid(); showConflict(d); }
  else adoptFile(d);
  setFileState('saved'); renderBanner();
}
async function disconnectBooksFile() {
  clearTimeout(FS.timer); FS.timer = null;
  Object.assign(FS, {handle: null, name: '', connected: false, knownRev: null, fileId: null, state: ''});
  try { await kv.del('fileHandle'); } catch (e) {}
  renderBanner(); showSaved();
}
async function pickNewBooksFile() {
  try {
    const h = await window.showSaveFilePicker({suggestedName: `${slug()}-books.json`, types: [{description: 'Shop Books file', accept: {'application/json': ['.json']}}]});
    await connectBooksFile(h, {isNew: true}); toast(`Your books are now saved in ${h.name}`);
  } catch (e) { if (e.name !== 'AbortError') alert('Could not create the file: ' + e.message); }
}
async function pickExistingBooksFile() {
  try {
    const [h] = await window.showOpenFilePicker({types: [{description: 'Shop Books file', accept: {'application/json': ['.json']}}]});
    await connectBooksFile(h, {ask: true}); toast(`Opened ${h.name}`);
  } catch (e) { if (e.name !== 'AbortError') alert('Could not open the file: ' + e.message); }
}
function showConflict(fileData) {
  if (dlg.open && $('#cfFile', dlg)) return;
  const when = fileData.savedAt ? new Date(fileData.savedAt).toLocaleString() : 'unknown time';
  openDialog(`<div class="dhead"><h2>Your books file was changed on another computer</h2></div>

/* ------------------------------- Ledger math ---------------------------- */
const acct = id => db.accounts.find(a => a.id === id);
const tOf = a => SUBS[a.sub]?.type || 'asset';
const sign = a => (['asset', 'expense'].includes(tOf(a)) ? 1 : -1);     // natural (normal) balance sign
const nat = (a, v) => sign(a) * (v || 0);
const aName = id => { const a = acct(id); return a ? `${a.code} · ${a.name}` : '(deleted account)'; };
const R = role => {
  const id = db.settings.roles[role];
  if (!id || !acct(id)) throw new Error(`Set the "${ROLES[role][0]}" default account in Settings first.`);
  return id;
};
function totals(from, to) {           // Map acctId -> debits minus credits within [from,to]
  const m = new Map();
  for (const e of db.entries) {
    if (from && e.date < from) continue;
    if (to && e.date > to) continue;
    for (const l of e.lines) m.set(l.acct, (m.get(l.acct) || 0) + l.dr - l.cr);
  }
  return m;
}
const bal = (id, to, from) => { const a = acct(id); return a ? nat(a, totals(from, to).get(id)) : 0; };
function fyStart(d) {
  const m = +db.settings.fyStartMonth || 1, y = +d.slice(0, 4), dm = +d.slice(5, 7);
  return `${dm >= m ? y : y - 1}-${pad(m)}-01`;
}
const locked = d => db.settings.lockDate && d <= db.settings.lockDate;
const sortedAccounts = (filter = () => true) =>
  db.accounts.filter(filter).sort((a, b) => TYPES.indexOf(tOf(a)) - TYPES.indexOf(tOf(b)) || a.code.localeCompare(b.code, undefined, {numeric: true}));

function validateEntry(e) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(e.date || '')) return 'Enter a valid date.';
  if (locked(e.date)) return `The books are locked through ${fmtDate(db.settings.lockDate)}. Change the lock date in Settings to post on or before it.`;
  const lines = e.lines.filter(l => l.dr || l.cr);
  if (lines.length < 2) return 'An entry needs at least two lines with amounts.';
  for (const l of lines) {
    if (!acct(l.acct)) return 'Every line with an amount needs an account.';
    if (l.dr < 0 || l.cr < 0) return 'Amounts cannot be negative. Put the amount in the other column instead.';
    if (l.dr && l.cr) return 'A line can have a debit or a credit, not both.';
  }
  const dr = lines.reduce((s, l) => s + l.dr, 0), cr = lines.reduce((s, l) => s + l.cr, 0);
  if (dr !== cr) return `Debits (${fmt(dr)}) and credits (${fmt(cr)}) must be equal. Difference: ${fmt(Math.abs(dr - cr))}.`;
  return null;
}
function postEntry(e, {skipValidate = false} = {}) {
  e.lines = e.lines.filter(l => l.dr || l.cr).map(l => ({id: l.id || uid(), acct: l.acct, dr: l.dr || 0, cr: l.cr || 0, memo: l.memo || '', rec: l.rec || null}));
  if (!skipValidate) { const err = validateEntry(e); if (err) throw new Error(err); }
  if (!e.id) { e.id = uid(); e.no = db.nextNo++; e.created = Date.now(); db.entries.push(e); }
  else { const i = db.entries.findIndex(x => x.id === e.id); db.entries[i] = e; }
  db.entries.sort((a, b) => a.date.localeCompare(b.date) || a.no - b.no);
  return e;
}
function deleteEntry(id) {
  db.entries = db.entries.filter(e => e.id !== id);
  db.counts = db.counts.filter(c => c.entryId !== id);
}
const entryTotal = e => e.lines.reduce((s, l) => s + l.dr, 0);
const hasRec = e => e.lines.some(l => l.rec);

}

const PRESETS = [['thisMonth', 'This month'], ['lastMonth', 'Last month'], ['thisQuarter', 'This quarter'], ['ytd', 'Year to date'], ['lastFY', 'Last year'], ['custom', 'Custom']];
function presetRange(p) {
  const t = today(), y = +t.slice(0, 4), m = +t.slice(5, 7);
  switch (p) {
    case 'thisMonth': return [`${y}-${pad(m)}-01`, monthEnd(y, m)];
    case 'lastMonth': { let yy = y, mm = m - 1; if (!mm) { mm = 12; yy--; } return [`${yy}-${pad(mm)}-01`, monthEnd(yy, mm)]; }
    case 'thisQuarter': { const q = Math.floor((m - 1) / 3) * 3 + 1; return [`${y}-${pad(q)}-01`, monthEnd(y, q + 2)]; }
    case 'ytd': return [fyStart(t), t];
    case 'lastFY': { const s = fyStart(t); return [addYears(s, -1), addDays(s, -1)]; }
  }
  return null;
}
function rangeControls(state) {
  if (state.preset !== 'custom') [state.from, state.to] = presetRange(state.preset);
  return `<div class="row noprint">
    <label class="field"><span>Period</span><select data-r="preset">${PRESETS.map(([k, l]) => `<option value="${k}" ${state.preset === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="field"><span>From</span><input type="date" data-r="from" value="${state.from || ''}"></label>
    <label class="field"><span>To</span><input type="date" data-r="to" value="${state.to || ''}"></label></div>`;
}
function bindRange(el, state, rerender) {
  $$('[data-r]', el).forEach(inp => inp.onchange = () => {
    const k = inp.dataset.r;
    if (k === 'preset') state.preset = inp.value; else { state[k] = inp.value; state.preset = 'custom'; }
    rerender();
  });
}

function vRecord(el) {

      groups.map(g => `<h2>${g}</h2><div class="grid">` + TEMPLATES.filter(t => t.group === g).map(t => `<button class="tile" data-t="${t.key}"><b>${esc(t.title)}</b><span>${esc(t.desc)}</span></button>`).join('') + '</div>').join('') +
      `<h2>Anything else</h2><div class="grid"><button class="tile" id="je"><b>General journal entry</b><span>Write the debits and credits yourself, for depreciation, loans, corrections and so on.</span></button>
       <button class="tile" id="cnt"><b>Inventory count / COGS</b><span>Month-end: count what's left and post cost of goods sold.</span></button></div>`;
    $$('[data-t]', el).forEach(b => b.onclick = () => { ui.template = b.dataset.t; render(); });
    $('#je').onclick = () => openEntryEditor(null);
    $('#cnt').onclick = () => go('inventory');
    return;
  }
  el.innerHTML = `<p class="noprint"><a href="#" id="back">← All transaction types</a></p><h1>${esc(t.title)}</h1><p class="muted">${esc(t.desc)}</p>
    ${t.help ? `<div class="help"><p>${t.help}</p></div>` : ''}${t.info ? `<p>${t.info()}</p>` : ''}
    <form class="panel" id="tf" autocomplete="off"><div class="form">${t.fields.map(fieldHtml).join('')}</div>
    <h3>What will be posted</h3><div id="pv" class="tablewrap"></div>
    <div class="row" style="margin-top:12px"><button class="btn primary" type="submit">Post entry</button><span id="tfErr" class="err"></span></div></form>`;
  $('#back').onclick = e => { e.preventDefault(); ui.template = null; render(); };
  const form = $('#tf');
  const preview = () => {
    $('#tfErr').textContent = '';
    try {
      const {lines} = buildFrom(t, form);
      const dr = lines.reduce((s, l) => s + l.dr, 0);
      $('#pv').innerHTML = `<table><thead><tr><th>Account</th><th class="n">Debit</th><th class="n">Credit</th></tr></thead><tbody>` +
        lines.map(l => `<tr><td>${esc(aName(l.acct))}${l.memo ? ` <span class="muted small">${esc(l.memo)}</span>` : ''}</td><td class="n">${fmtB(l.dr)}</td><td class="n">${fmtB(l.cr)}</td></tr>`).join('') +
        `<tr class="sub"><td>Total</td><td class="n">${fmt(dr)}</td><td class="n">${fmt(dr)}</td></tr></tbody></table>`;
    } catch (e) { $('#pv').innerHTML = `<p class="muted small">${esc(e.message)}</p>`; }
  };
  form.addEventListener('input', preview);
  form.addEventListener('change', preview);
  preview();
  form.onsubmit = ev => {
    ev.preventDefault();
    try {
      const built = buildFrom(t, form);
      const e = postEntry({date: built.date, ref: built.ref, memo: built.memo, kind: t.key, lines: built.lines});
      save(); ui.lastDate = e.date;
      $$('input', form).forEach(i => { if (i.type !== 'date') i.value = ''; });
      preview(); renderBanner();
      $('input.money', form)?.focus();
      toast(`Posted entry #${e.no}`, {label: 'Undo', fn: () => { deleteEntry(e.id); save(); render(); toast('Entry removed'); }});
    } catch (err) { $('#tfErr').textContent = err.message; }
  };
}
function fieldHtml(f) {
  const id = 'f_' + f.k;
  let input;
  if (f.type === 'date') input = `<input type="date" id="${id}" name="${f.k}" value="${ui.lastDate || today()}" required>`;
  else if (f.type === 'money') input = `<input id="${id}" name="${f.k}" class="money" inputmode="decimal" placeholder="0.00">`;
  else if (f.type === 'account') input = `<select id="${id}" name="${f.k}">${acctOptions(f.role ? db.settings.roles[f.role] : f.def, f.filter)}</select>`;
  else input = `<input id="${id}" name="${f.k}" type="text">`;
  return `<label class="field" for="${id}"><span>${esc(f.label)}</span>${input}${f.hint ? `<small>${esc(f.hint)}</small>` : ''}</label>`;
}
function buildFrom(t, form) {
  const v = {};
  for (const f of t.fields) {
    const raw = form.elements[f.k].value;
    if (f.type === 'money') {
      const c = parseMoney(raw);
      if (Number.isNaN(c)) throw new Error(`"${f.label}" isn't a valid amount.`);
      if (c < 0) throw new Error(`"${f.label}" can't be negative.`);
      v[f.k] = c;
    } else v[f.k] = raw.trim();
  }
  const out = t.build(v);
  return {date: v.date, ref: v.ref || '', memo: out.memo, lines: out.lines.filter(Boolean)};
}

/* ----------------------- General journal entry editor ------------------- */
function openEntryEditor(entry) {
  const e = entry ? structuredClone(entry) : {date: ui.lastDate || today(), ref: '', memo: '', kind: 'journal', lines: [L('', 0, 0), L('', 0, 0)]};
  const ro = entry && hasRec(entry), lk = entry && locked(entry.date);
  const frozen = ro || lk;
  const lineRow = (l, i) => `<tr data-i="${i}">
    <td><select data-f="acct" ${frozen ? 'disabled' : ''}>${acctOptions(l.acct, () => true, {blank: true})}</select></td>
    <td><input data-f="memo" value="${esc(l.memo)}" placeholder="Line note" ${frozen ? 'disabled' : ''}></td>
    <td><input data-f="dr" class="money" inputmode="decimal" value="${l.dr ? plain(l.dr) : ''}" ${frozen ? 'disabled' : ''}></td>
    <td><input data-f="cr" class="money" inputmode="decimal" value="${l.cr ? plain(l.cr) : ''}" ${frozen ? 'disabled' : ''}></td>
    <td>${frozen ? (l.rec ? '<span class="pill" title="Reconciled">R</span>' : '') : `<button type="button" class="btn sm" data-del="${i}" title="Remove line">✕</button>`}</td></tr>`;
  const draw = () => {
    openDialog(`<div class="dhead"><h2>${entry ? `Entry #${entry.no}` : 'General journal entry'}</h2><button class="btn sm" data-close>Close</button></div>
    <div class="dbody">
      ${ro ? '<div class="help"><p>Some lines in this entry are reconciled, so only the reference and note can be changed. To change amounts, undo that reconciliation on the Reconcile page.</p></div>' : ''}
      ${lk ? `<div class="help"><p>This entry is dated inside the locked period (through ${fmtDate(db.settings.lockDate)}), so it can't be changed.</p></div>` : ''}
      <div class="row" style="margin:10px 0">
        <label class="field"><span>Date</span><input type="date" id="jeDate" value="${e.date}" ${frozen ? 'disabled' : ''}></label>
        <label class="field"><span>Reference</span><input id="jeRef" value="${esc(e.ref)}" placeholder="Check #, invoice #…" ${lk ? 'disabled' : ''}></label>
        <label class="field" style="flex:1;min-width:200px"><span>Description</span><input id="jeMemo" value="${esc(e.memo)}" ${lk ? 'disabled' : ''}></label>
      </div>
      <div class="tablewrap"><table class="lines"><thead><tr><th style="width:38%">Account</th><th>Note</th><th class="n">Debit</th><th class="n">Credit</th><th></th></tr></thead>
      <tbody>${e.lines.map(lineRow).join('')}</tbody>
      <tfoot><tr><td>${frozen ? '' : '<button type="button" class="btn sm" id="addLine">+ Add line</button>'}</td><td class="n muted">Totals</td><td class="n" id="tDr"></td><td class="n" id="tCr"></td><td></td></tr></tfoot></table></div>
      <p id="jeStatus"></p>
      <p class="small muted">Debits increase assets and expenses. Credits increase liabilities, equity and income. Total debits must equal total credits.</p>
    </div>
    <div class="dfoot">${entry && !frozen ? '<button class="btn danger" id="jeDel" style="margin-right:auto">Delete entry</button>' : ''}
      <button class="btn" data-close>Cancel</button>${lk ? '' : '<button class="btn primary" id="jeSave">Save</button>'}</div>`, wire);
  };
  const collect = () => {
    $$('tbody tr', dlg).forEach(tr => {
      const l = e.lines[+tr.dataset.i];
      l.acct = $('[data-f=acct]', tr).value; l.memo = $('[data-f=memo]', tr).value;
      l._dr = $('[data-f=dr]', tr).value; l._cr = $('[data-f=cr]', tr).value;
      l.dr = parseMoney(l._dr); l.cr = parseMoney(l._cr);
    });
    e.date = $('#jeDate').value; e.ref = $('#jeRef').value.trim(); e.memo = $('#jeMemo').value.trim();
  };
  const status = () => {
    collect();
    const bad = e.lines.some(l => Number.isNaN(l.dr) || Number.isNaN(l.cr));
    const dr = e.lines.reduce((s, l) => s + (l.dr || 0), 0), cr = e.lines.reduce((s, l) => s + (l.cr || 0), 0);
    $('#tDr').textContent = fmt(dr); $('#tCr').textContent = fmt(cr);
    $('#jeStatus').innerHTML = bad ? '<span class="err">One of the amounts isn\'t a valid number.</span>'
      : dr === cr && dr ? '<span class="ok">✓ Balanced</span>' : dr || cr ? `<span class="err">Out of balance by ${fmt(Math.abs(dr - cr))}</span>` : '';
  };
  const wire = () => {
    status();
    $('.dbody', dlg).addEventListener('input', status);
    $('.dbody', dlg).addEventListener('change', status);
    $('#addLine')?.addEventListener('click', () => { collect(); e.lines.push(L('', 0, 0)); draw(); });
    $$('[data-del]', dlg).forEach(b => b.onclick = () => { collect(); e.lines.splice(+b.dataset.del, 1); if (e.lines.length < 2) e.lines.push(L('', 0, 0)); draw(); });
    $('#jeDel')?.addEventListener('click', () => {
      if (!confirm(`Delete entry #${entry.no}? This cannot be undone (except by restoring a backup).`)) return;
      deleteEntry(entry.id); save(); closeDialog(); render(); toast('Entry deleted');
    });
    $('#jeSave')?.addEventListener('click', () => {
      collect();
      if (e.lines.some(l => Number.isNaN(l.dr) || Number.isNaN(l.cr))) { $('#jeStatus').innerHTML = '<span class="err">Fix the invalid amounts first.</span>'; return; }
      try {
        if (ro) { const orig = db.entries.find(x => x.id === entry.id); orig.ref = e.ref; orig.memo = e.memo; }
        else postEntry({...e, lines: e.lines.map(({_dr, _cr, ...l}) => l)});
        save(); closeDialog(); ui.lastDate = e.date; render(); toast(entry ? 'Entry updated' : 'Entry posted');
      } catch (err) { $('#jeStatus').innerHTML = `<span class="err">${esc(err.message)}</span>`; }
    });
  };
  draw();
}

/* --------------------------------- Ledger ------------------------------- */
function vLedger(el) {
  const s = ui.ledger;
  if (!s.acct || !acct(s.acct)) s.acct = db.settings.roles.checking || db.accounts[0]?.id;
  const [from, to] = s.preset === 'custom' ? [s.from, s.to] : presetRange(s.preset);
  const a = acct(s.acct);
  const opening = from ? nat(a, totals(null, addDays(from, -1)).get(a.id)) : 0;
  let run = opening, rows = '';
  for (const e of db.entries) {
    if ((from && e.date < from) || (to && e.date > to)) continue;
    for (const l of e.lines) {
      if (l.acct !== a.id) continue;
      run += nat(a, l.dr - l.cr);
      rows += `<tr class="click" data-e="${e.id}"><td style="white-space:nowrap">${fmtDate(e.date)}</td><td>${e.no}</td><td>${esc(e.memo)}${l.memo ? ` <span class="muted small">· ${esc(l.memo)}</span>` : ''}${e.ref ? ` <span class="muted small">· ${esc(e.ref)}</span>` : ''}</td>
        <td class="small muted">${esc(e.lines.filter(x => x !== l).map(x => acct(x.acct)?.name).join(', '))}</td><td>${l.rec ? '<span class="pill" title="Reconciled">R</span>' : ''}</td>
        <td class="n">${fmtB(l.dr)}</td><td class="n">${fmtB(l.cr)}</td><td class="n">${fmtN(run)}</td></tr>`;
    }
  }
  el.innerHTML = `<h1>Account ledger</h1><div class="panel"><div class="row">
      <label class="field" style="min-width:260px"><span>Account</span><select id="la">${acctOptions(a.id)}</select></label>${rangeControls(s)}</div></div>
    <div class="panel"><div class="print-only"><b>${esc(db.settings.shopName)}</b></div><h2 style="margin-top:0">${esc(a.code)} · ${esc(a.name)}</h2><p class="muted small">${esc(SUBS[a.sub].label)} · ${fmtDate(from) || 'beginning'} to ${fmtDate(to)}</p>
    <div class="tablewrap"><table><thead><tr><th>Date</th><th>#</th><th>Description</th><th>Other side</th><th></th><th class="n">Debit</th><th class="n">Credit</th><th class="n">Balance</th></tr></thead>
    <tbody><tr><td colspan="7" class="muted">Balance forward</td><td class="n">${fmtN(opening)}</td></tr>${rows}
    <tr class="tot"><td colspan="7">Ending balance</td><td class="n">${fmtN(run)}</td></tr></tbody></table></div></div>`;
  $('#la').onchange = ev => { s.acct = ev.target.value; vLedger(el); };
  bindRange(el, s, () => vLedger(el));
  bindEntryTable(el);
}

function vReconcile(el) {
  const draft = db.reconDraft;
  if (draft && acct(draft.acct)) return reconWork(el, draft);
  const recAccts = sortedAccounts(a => ['bank', 'clearing', 'creditcard', 'cash'].includes(a.sub) && a.active);
  const hist = [...db.recons].sort((a, b) => b.stmtDate.localeCompare(a.stmtDate));
  el.innerHTML = `<h1>Reconcile</h1>
    <div class="help"><p>Once a month, match your books to the bank or credit card statement. Tick each transaction that appears on the statement. When the difference is $0.00, your books match the bank.</p></div>

const latestRecon = id => db.recons.filter(r => r.acct === id).sort((a, b) => b.stmtDate.localeCompare(a.stmtDate))[0];
function reconWork(el, d) {

    ${items.map(({e, l}) => `<tr><td><input type="checkbox" data-l="${l.id}" ${checked.has(l.id) ? 'checked' : ''} aria-label="Cleared"></td><td style="white-space:nowrap">${fmtDate(e.date)}</td><td>${e.no}</td>
      <td>${esc(e.memo)}${e.ref ? ` <span class="muted small">· ${esc(e.ref)}</span>` : ''}</td>
      <td class="n">${fmtB(l.cr)}</td><td class="n">${fmtB(l.dr)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">No uncleared transactions up to this date.</td></tr>'}
    </tbody></table></div><p class="small muted">Something on the statement that isn't in your books, such as a bank fee or interest? Record it (Record → Pay a bill or expense), then come back. Your ticks are kept.</p></div>`;

  $('#all').onclick = () => { items.forEach(x => checked.add(x.l.id)); $$('[data-l]', el).forEach(c => c.checked = true); calc(); };
  $('#none').onclick = () => { checked.clear(); $$('[data-l]', el).forEach(c => c.checked = false); calc(); };
  $('#cancel').onclick = () => { if (confirm('Discard this reconciliation in progress?')) { delete db.reconDraft; save(false); vReconcile(el); } };
  $('#later').onclick = () => { save(false); go('dash'); toast('Reconciliation saved. Open Reconcile to continue.'); };

/* -------------------------------- Reports ------------------------------- */
function plData(from, to) {
  const t = totals(from, to);
  const sec = subs => sortedAccounts(a => subs.includes(a.sub)).map(a => ({a, v: nat(a, t.get(a.id))})).filter(r => r.v);
  const sum = rows => rows.reduce((s, r) => s + r.v, 0);
  const r = {incomeRows: sec(['income']), cogsRows: sec(['cogs']), opexRows: sec(['expense']), oiRows: sec(['otherincome']), oeRows: sec(['otherexpense'])};
  r.income = sum(r.incomeRows); r.cogs = sum(r.cogsRows); r.opex = sum(r.opexRows); r.oi = sum(r.oiRows); r.oe = sum(r.oeRows);
  r.gross = r.income - r.cogs; r.opInc = r.gross - r.opex; r.net = r.opInc + r.oi - r.oe;
  return r;
}
function bsData(d) {
  const fy = fyStart(d), all = totals(null, d), prior = totals(null, addDays(fy, -1)), cur = totals(fy, d);
  const rows = subs => sortedAccounts(a => subs.includes(a.sub)).map(a => ({a, v: nat(a, all.get(a.id))})).filter(r => r.v);
  const ni = m => db.accounts.filter(a => ['income', 'expense'].includes(tOf(a))).reduce((s, a) => s - (m.get(a.id) || 0), 0);
  const r = {
    cash: rows(['bank', 'cash', 'clearing']), ca: rows(['ar', 'inventory', 'otherca']), fa: rows(['fixed']),
    cl: rows(['ap', 'creditcard', 'currentliab']), ll: rows(['longterm']), eq: rows(['equity']),
    priorNI: ni(prior), curNI: ni(cur),
  };
  const s = x => x.reduce((t, y) => t + y.v, 0);
  r.assets = s(r.cash) + s(r.ca) + s(r.fa); r.liab = s(r.cl) + s(r.ll); r.equity = s(r.eq) + r.priorNI + r.curNI;
  r.sum = s;
  return r;
}

function rPLM(el, rerender) {

      });

      $('#obS').innerHTML = bad ? '<span class="err">One of the amounts isn\'t valid.</span>' : `Opening Balance Equity: <b>${fmt(net)}</b> (your starting net worth in the business)`;

function download(name, text, type) {
  const blob = new Blob([text], {type}), a = document.createElement('a');

  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

    try {
      const d = normalizeDb(JSON.parse(rd.result));
      if (!confirm(`Restore this backup (${d.entries.length} entries${d.settings.shopName ? ' for ' + d.settings.shopName : ''})? It REPLACES what is in this browser now${FS.connected ? ` and in ${FS.name}` : ''}.`)) return;
      db = d; save(); go('dash'); toast('Backup restored');
    } catch (e) { alert('Could not restore: ' + e.message); }
  };
  rd.readAsText(f);
};
function exportCSV() {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Date', 'Entry #', 'Type', 'Reference', 'Description', 'Account code', 'Account', 'Debit', 'Credit', 'Line note', 'Reconciled']];
  for (const e of db.entries) for (const l of e.lines) { const a = acct(l.acct);
    rows.push([e.date, e.no, KIND_LABEL[e.kind] || e.kind, e.ref, e.memo, a?.code, a?.name, l.dr ? plain(l.dr) : '', l.cr ? plain(l.cr) : '', l.memo, l.rec ? 'Y' : '']); }
  download(`${slug()}-journal-${today()}.csv`, rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
}

/* ------------------------------- Sample data ---------------------------- */
function loadDemo() {
  if (FS.handle) disconnectBooksFile();   // never write sample data into a real books file
  db = seed(); db.settings.demo = true; db.settings.shopName = 'Sample Chocolate Shop';
  let seedN = 42; const rnd = () => { seedN = (seedN * 1664525 + 1013904223) % 4294967296; return seedN / 4294967296; };
  const amt = (lo, hi) => Math.round((lo + rnd() * (hi - lo)) * 100);
  const t = today(), y = +t.slice(0, 4), m = +t.slice(5, 7);
  let py = y, pm = m - 1; if (!pm) { pm = 12; py--; }
  const start = `${py}-${pad(pm)}-01`, prevEnd = monthEnd(py, pm), end = addDays(t, -1);
  const P = (date, memo, kind, lines, ref = '') => postEntry({date, memo, kind, ref, lines: lines.filter(Boolean)}, {skipValidate: true});
  P(addDays(start, -1), 'Opening balances', 'opening', [L('a1000', 850000, 0), L('a1050', 20000, 0), L('a1300', 180000, 0), L('a1310', 60000, 0), L('a1320', 35000, 0), L('a1500', 950000, 0), L('a2100', 0, 45000), L('a3200', 0, 2050000)]);
  db.items = [
    {id: uid(), name: '70% dark couverture', acct: 'a1300', unit: 'kg', cost: 1850}, {id: uid(), name: 'Milk couverture', acct: 'a1300', unit: 'kg', cost: 1600},
    {id: uid(), name: 'Heavy cream', acct: 'a1300', unit: 'qt', cost: 525}, {id: uid(), name: 'Nuts & inclusions', acct: 'a1300', unit: 'lb', cost: 950},
    {id: uid(), name: '9-piece gift box', acct: 'a1310', unit: 'each', cost: 110}, {id: uid(), name: 'Ribbon', acct: 'a1310', unit: 'roll', cost: 600},
    {id: uid(), name: 'Hot cocoa tins', acct: 'a1320', unit: 'each', cost: 750}];
  let drawer = 20000, pendingCard = [];
  for (let d = start; d <= end; d = addDays(d, 1)) {
    const day = +d.slice(8, 10), w = dow(d);
    while (pendingCard.length && pendingCard[0].pay <= d) { const p = pendingCard.shift(); const fee = Math.round(p.amt * 0.029) + 300;
      P(d, 'Card processor payout', 'payout', [D('a1000', p.amt - fee), D('a6020', fee, 'Processing fees'), C('a1100', p.amt)]); }
    if (day === 1) P(d, 'Rent – Main Street', 'expense', [D('a6000', 240000), C('a1000', 240000)], 'Landlord');
    if (day === 3) P(d, 'Software & Website – POS subscription', 'expense', [D('a6080', 8900), C('a2100', 8900)]);
    if (day === 12) { const u = amt(260, 340); P(d, 'Utilities – electric & gas', 'expense', [D('a6010', u), C('a1000', u)]); }
    if (day === 15) P(d, 'Insurance – general liability', 'expense', [D('a6060', 14500), C('a2100', 14500)]);
    if (day === 20) P(d, 'Advertising – local magazine', 'expense', [D('a6070', 12000), C('a2100', 12000)]);
    if (day === 10) P(d, 'Purchase – Couverture supplier', 'purchase', [D('a1300', 260000), C('a2000', 260000)], 'Cacao Imports');
    if (day === 25) P(d, 'Bill payment – Cacao Imports', 'paybill', [D('a2000', 260000), C('a1000', 260000)]);
    if (day % 7 === 4) { const p = amt(260, 420); P(d, 'Purchase – Dairy & ingredients', 'purchase', [D('a1300', p), C('a1000', p)], 'Local Dairy'); }
    if (day === 6 || day === 21) P(d, 'Purchase – Gift boxes & ribbon', 'purchase', [D('a1310', 42000), C('a2100', 42000)], 'Box Co.');
    if (day === 22) { const ccBal = bal('a2100', d); if (ccBal > 0) P(d, 'Credit card payment', 'paycc', [D('a2100', ccBal), C('a1000', ccBal)]); }
    if (day === 28) P(d, 'Owner draw', 'ownerout', [D('a3100', 150000), C('a1000', 150000)]);
    if (w === 1) continue; // closed Mondays
    const boost = (w === 0 || w === 6) ? 1.6 : 1, cash = Math.round(amt(50, 160) * boost), card = Math.round(amt(260, 620) * boost), tax = Math.round((cash + card) * 0.06 / 1.06);
    P(d, 'Daily sales', 'sales', [D('a1050', cash, 'Cash sales'), D('a1100', card, 'Card sales'), C('a4000', cash + card - tax), C('a2200', tax, 'Sales tax collected')]);
    drawer += cash; pendingCard.push({amt: card, pay: addDays(d, 2)});
    if (w === 6 && drawer > 30000) { const dep = drawer - 20000; P(d, 'Cash deposit', 'deposit', [D('a1000', dep), C('a1050', dep)]); drawer -= dep; }
    if (day % 9 === 0) { const g = amt(25, 75); P(d, 'Gift card sold', 'gcsold', [D('a1100', g), C('a2300', g)]); pendingCard.push({amt: g, pay: addDays(d, 2)}); }
    if (day === 14) P(d, 'Chocolate tasting class (8 guests)', 'sales', [D('a1100', 36000), C('a4200', 36000)]);
    if (day === 18) { P(d, 'Invoice – corporate gift boxes', 'invoice', [D('a1200', 64000), C('a4100', 64000)], 'Acme Law LLP'); }
  }
  // Month-end inventory count for last month
  const tt = totals(null, prevEnd), lines = [];
  for (const [inv, cogs, keep] of [['a1300', 'a5000', 0.42], ['a1310', 'a5010', 0.55], ['a1320', 'a5020', 0.6]]) {
    const book = tt.get(inv) || 0, counted = Math.round(book * keep / 100) * 100, used = book - counted;
    if (used) lines.push(D(cogs, used, 'Used / sold'), C(inv, used));
  }
  const ce = P(prevEnd, 'Inventory count – cost of goods sold', 'count', lines);
  db.counts.push({id: uid(), date: prevEnd, qty: {}, manual: {}, total: ['a1300', 'a1310', 'a1320'].reduce((s, a) => s + bal(a, prevEnd), 0), entryId: ce.id});
  // Received payment on the invoice
  if (addDays(start, 27) <= end) P(addDays(start, 27), 'Invoice payment received', 'received', [D('a1000', 64000), C('a1200', 64000)], 'Acme Law LLP');
  db.settings.lastBackup = Date.now();
  save();
}

render();
initBooksFile();
